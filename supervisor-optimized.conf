# Optimized Supervisor configuration for action processing
# Balanced for 3 vCPU / 8GB RAM - prioritizes action processing over raw throughput
# Place this file as /etc/supervisor/conf.d/laravel-optimized.conf

[program:laravel-queue-default]
process_name=%(program_name)s_%(process_num)02d
command=php /home/egfollow/htdocs/egfollow.com/artisan queue:work redis --queue=default --sleep=1 --tries=3 --max-time=3600 --memory=256 --timeout=60
directory=/home/egfollow/htdocs/egfollow.com
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=egfollow
numprocs=4
redirect_stderr=true
stdout_logfile=/home/egfollow/htdocs/egfollow.com/storage/logs/queue-default.log
stopwaitsecs=30

[program:laravel-queue-high]
process_name=%(program_name)s_%(process_num)02d
command=php /home/egfollow/htdocs/egfollow.com/artisan queue:work redis --queue=high --sleep=0 --tries=2 --max-time=1800 --memory=512 --timeout=30
directory=/home/egfollow/htdocs/egfollow.com
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=egfollow
numprocs=3
redirect_stderr=true
stdout_logfile=/home/egfollow/htdocs/egfollow.com/storage/logs/queue-high.log
stopwaitsecs=30

[program:laravel-action-processor]
process_name=%(program_name)s_%(process_num)02d
command=php /home/egfollow/htdocs/egfollow.com/artisan queue:work redis --queue=default --sleep=2 --tries=3 --max-time=7200 --memory=256 --timeout=120
directory=/home/egfollow/htdocs/egfollow.com
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=egfollow
numprocs=2
redirect_stderr=true
stdout_logfile=/home/egfollow/htdocs/egfollow.com/storage/logs/action-processor.log
stopwaitsecs=30

[program:bulk-order-processor]
process_name=%(program_name)s
command=php /home/egfollow/htdocs/egfollow.com/artisan orders:process-pending --continuous
directory=/home/egfollow/htdocs/egfollow.com
autostart=true
autorestart=true
user=egfollow
redirect_stderr=true
stdout_logfile=/home/egfollow/htdocs/egfollow.com/storage/logs/bulk-processor.log
stopwaitsecs=30

[group:laravel-workers]
programs=laravel-queue-default,laravel-queue-high,laravel-action-processor,bulk-order-processor
priority=999
