# High-performance Supervisor configuration for 3 vCPU / 8GB RAM server
# Place this file as /etc/supervisor/conf.d/laravel-high-performance.conf

[program:laravel-queue-high-performance]
process_name=%(program_name)s_%(process_num)02d
command=php /home/egfollow/htdocs/egfollow.com/artisan queue:work redis --queue=high,default --sleep=1 --tries=3 --max-time=3600 --max-jobs=1000
directory=/home/egfollow/htdocs/egfollow.com
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=egfollow
numprocs=6
redirect_stderr=true
stdout_logfile=/home/egfollow/htdocs/egfollow.com/storage/logs/worker.log
stopwaitsecs=3600

[program:laravel-bulk-processor]
process_name=%(program_name)s_%(process_num)02d
command=php /home/egfollow/htdocs/egfollow.com/artisan queue:work redis --queue=bulk --sleep=1 --tries=2 --max-time=1800 --max-jobs=500
directory=/home/egfollow/htdocs/egfollow.com
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=egfollow
numprocs=2
redirect_stderr=true
stdout_logfile=/home/egfollow/htdocs/egfollow.com/storage/logs/bulk-processor.log
stopwaitsecs=3600

[program:laravel-scheduler]
process_name=%(program_name)s
command=php /home/egfollow/htdocs/egfollow.com/artisan schedule:work
directory=/home/egfollow/htdocs/egfollow.com
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=egfollow
numprocs=1
redirect_stderr=true
stdout_logfile=/home/egfollow/htdocs/egfollow.com/storage/logs/scheduler.log

[group:laravel-workers]
programs=laravel-queue-high-performance,laravel-bulk-processor,laravel-scheduler
priority=999
