# Redis Performance Configuration for 3 vCPU + 8GB RAM Server
# Optimized for 2000+ actions/minute with queue processing

# Memory Management (Conservative for 8GB server)
maxmemory 4gb
maxmemory-policy allkeys-lru

# Persistence - Balanced for performance and safety
save 300 10
save 60 1000
stop-writes-on-bgsave-error no
rdbcompression yes
rdbchecksum yes

# AOF disabled for maximum performance
appendonly no

# Network & Connection Limits (Conservative)
tcp-keepalive 300
timeout 0
tcp-backlog 511
maxclients 5000

# Performance Tuning for 3 vCPU
hz 25
dynamic-hz yes

# Slow Log
slowlog-log-slower-than 5000
slowlog-max-len 64

# Client Buffer Limits (for queue processing)
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Memory optimizations for queues
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# Lua scripts timeout
lua-time-limit 5000

# Database numbers (match your .env)
databases 3
