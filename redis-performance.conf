# Redis Performance Configuration for 3 vCPU + 8GB RAM Server
# Optimized for 2000+ actions/minute with queue processing

# Memory Management (MAXIMUM for 8GB RAM)
maxmemory 7gb
maxmemory-policy allkeys-lru

# Persistence - Maximum performance (less frequent saves)
save 600 100
save 300 1000
stop-writes-on-bgsave-error no
rdbcompression yes
rdbchecksum no

# AOF disabled for maximum performance
appendonly no

# Network & Connection Limits (MAXIMUM for 32 workers)
tcp-keepalive 30
timeout 0
tcp-backlog 2048
maxclients 20000

# Performance Tuning for MAXIMUM 3 vCPU utilization
hz 100
dynamic-hz yes

# Slow Log (more aggressive monitoring)
slowlog-log-slower-than 2000
slowlog-max-len 128

# Client Buffer Limits (for queue processing)
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Memory optimizations for queues
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# Lua scripts timeout
lua-time-limit 5000

# Database numbers (match your .env)
databases 3
