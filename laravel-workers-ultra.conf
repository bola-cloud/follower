# Ultra High-Performance Supervisor Configuration
# Place this in /etc/supervisor/conf.d/laravel-workers-ultra.conf

[program:laravel-queue-high]
process_name=%(program_name)s_%(process_num)02d
command=php /home/egfollow/htdocs/egfollow.com/artisan queue:work redis --queue=high --sleep=0 --tries=2 --max-time=3600 --memory=512 --timeout=30
directory=/home/egfollow/htdocs/egfollow.com
autostart=true
autorestart=true
user=root
numprocs=8
redirect_stderr=true
stdout_logfile=/home/egfollow/htdocs/egfollow.com/storage/logs/queue-high.log
stopwaitsecs=30

[program:laravel-queue-default]
process_name=%(program_name)s_%(process_num)02d
command=php /home/egfollow/htdocs/egfollow.com/artisan queue:work redis --queue=default --sleep=1 --tries=3 --max-time=3600 --memory=256 --timeout=60
directory=/home/egfollow/htdocs/egfollow.com
autostart=true
autorestart=true
user=root
numprocs=12
redirect_stderr=true
stdout_logfile=/home/egfollow/htdocs/egfollow.com/storage/logs/queue-default.log
stopwaitsecs=30

[program:bulk-order-processor]
process_name=%(program_name)s
command=php /home/egfollow/htdocs/egfollow.com/artisan orders:process-pending --continuous
directory=/home/egfollow/htdocs/egfollow.com
autostart=true
autorestart=true
user=root
redirect_stderr=true
stdout_logfile=/home/egfollow/htdocs/egfollow.com/storage/logs/bulk-processor.log
stopwaitsecs=30
