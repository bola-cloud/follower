[program:laravel-queue-high]
process_name=%(program_name)s_%(process_num)02d
command=php /home/egfollow/htdocs/egfollow.com/artisan queue:work redis --queue=high,default --sleep=0 --tries=3 --timeout=120 --max-jobs=2000 --max-time=3600 --memory=512
directory=/home/egfollow/htdocs/egfollow.com
autostart=true
autorestart=true
user=root
numprocs=3
redirect_stderr=true
stdout_logfile=/home/egfollow/htdocs/egfollow.com/storage/logs/queue-high.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stopsignal=QUIT
killasgroup=true
stopwaitsecs=30

[program:laravel-queue-bulk]
process_name=%(program_name)s_%(process_num)02d
command=php /home/egfollow/htdocs/egfollow.com/artisan queue:work redis --queue=bulk --sleep=0 --tries=2 --timeout=150 --max-jobs=1500 --max-time=3600 --memory=384
directory=/home/egfollow/htdocs/egfollow.com
autostart=true
autorestart=true
user=root
numprocs=1
redirect_stderr=true
stdout_logfile=/home/egfollow/htdocs/egfollow.com/storage/logs/queue-bulk.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stopsignal=QUIT
killasgroup=true
stopwaitsecs=30
