
# Laravel Workers Ultra Configuration - Enhanced with Batch Processing
# Maximum throughput configuration for 10,000+ concurrent users
# Database connections: <30 total (down from 200+)

[program:laravel-queue-high]
process_name=%(program_name)s_%(process_num)02d
command=php /home/egfollow/htdocs/egfollow.com/artisan queue:work redis --queue=high --sleep=0 --tries=1 --timeout=60 --max-jobs=5000 --max-time=3600 --memory=256
directory=/home/egfollow/htdocs/egfollow.com
autostart=true
autorestart=true
user=egfollow
numprocs=16
redirect_stderr=true
stdout_logfile=/home/egfollow/htdocs/egfollow.com/storage/logs/queue-high.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stopsignal=QUIT
killasgroup=true
stopwaitsecs=2
environment=QUEUE_CONNECTION="redis",REDIS_CLIENT="predis",REDIS_DB="2"

