; Supervisor program to run Laravel scheduler in a test mode.
; This config uses the same environment variable name `COORDINATOR_INTERVAL_HOURS`
; but runs `php artisan schedule:run` every N minutes where N = COORDINATOR_INTERVAL_HOURS * 60.
; Use this to test scheduling frequency in production for short durations, then revert.

[program:laravel-scheduler-test]
process_name=%(program_name)s
; Use a bash loop that converts hours -> minutes and runs schedule:run every N minutes.
; Run schedule:run in a tight loop, logging to an absolute logfile and sleeping 60s
; Clear cache on first run, then run schedule:run every 60s
command=bash -lc 'cd /home/egfollow/htdocs/egfollow.com && /usr/bin/php8.4 artisan config:clear && /usr/bin/php8.4 artisan cache:clear && while true; do /usr/bin/php8.4 artisan schedule:run -vvv >> /home/egfollow/htdocs/egfollow.com/storage/logs/laravel-scheduler-test.log 2>&1; sleep 60; done'
directory=/home/egfollow/htdocs/egfollow.com
autostart=true
autorestart=true
startsecs=5
user=egfollow
redirect_stderr=true
stdout_logfile=/home/egfollow/htdocs/egfollow.com/storage/logs/laravel-scheduler-test.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=7
stopsignal=QUIT
killasgroup=true
stopwaitsecs=10
environment=APP_ENV="production",APP_DEBUG="false",COORDINATOR_INTERVAL_HOURS="1",PATH="/usr/local/bin:/usr/bin:/bin"

; Notes:
; - This program is intended for temporary testing. It runs `schedule:run` in a loop and
;   sleeps for COORDINATOR_INTERVAL_HOURS * 60 minutes between runs. Set COORDINATOR_INTERVAL_HOURS
;   to a small integer (e.g., 1) while testing. For precise minute-based tests use the minutes variant.
