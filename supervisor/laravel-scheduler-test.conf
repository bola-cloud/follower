; Supervisor program to run Laravel scheduler in a test mode.
; This config uses the same environment variable name `COORDINATOR_INTERVAL_HOURS`
; but runs `php artisan schedule:run` every N minutes where N = COORDINATOR_INTERVAL_HOURS * 60.
; Use this to test scheduling frequency in production for short durations, then revert.

[program:laravel-scheduler-test]
process_name=%(program_name)s
; Use a bash loop that converts hours -> minutes and runs schedule:run every N minutes.
command=bash -lc 'cd /home/egfollow/htdocs/egfollow.com && minutes=$(( ${COORDINATOR_INTERVAL_HOURS:-1} * 60 )); while true; do php artisan schedule:run >> storage/logs/laravel-scheduler-test.log 2>&1; sleep ${minutes}m; done'
directory=/home/egfollow/htdocs/egfollow.com
autostart=false
autorestart=true
startsecs=5
user=egfollow
redirect_stderr=true
stdout_logfile=/home/egfollow/htdocs/egfollow.com/storage/logs/laravel-scheduler-test.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=7
stopsignal=QUIT
killasgroup=true
stopwaitsecs=10
environment=APP_ENV="production",APP_DEBUG="false",COORDINATOR_INTERVAL_HOURS="1"

; Notes:
; - This program is intended for temporary testing. It runs `schedule:run` in a loop and
;   sleeps for COORDINATOR_INTERVAL_HOURS * 60 minutes between runs. Set COORDINATOR_INTERVAL_HOURS
;   to a small integer (e.g., 0.1 will not work in integer math; use integers like 1 for 1 hour,
;   but for short tests set to 0 and edit the command if you need sub-minute sleep). For simple
;   minute-level tests set COORDINATOR_INTERVAL_HOURS=0 and change the command manually to
;   use COORDINATOR_INTERVAL_MINUTES instead (or set COORDINATOR_INTERVAL_HOURS to 1 and treat
;   it as minutes by modifying the command). See README or ask me to create a minute-based variant.
