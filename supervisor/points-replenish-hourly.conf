[program:points-replenish-hourly]
process_name=%(program_name)s
command=bash -lc 'cd /home/egfollow/htdocs/egfollow.com && while true; do php artisan points:replenish-zero-balance >> /home/egfollow/htdocs/egfollow.com/storage/logs/replenish-zero-balance.log 2>&1; sleep 1h; done'
directory=/home/egfollow/htdocs/egfollow.com
autostart=true
autorestart=true
startsecs=5
user=egfollow
redirect_stderr=true
stdout_logfile=/home/egfollow/htdocs/egfollow.com/storage/logs/replenish-zero-balance.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=7
stopsignal=QUIT
killasgroup=true
stopwaitsecs=10
environment=APP_ENV="production",APP_DEBUG="false"
