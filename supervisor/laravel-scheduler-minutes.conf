; Supervisor program to run Laravel scheduler every N minutes (test-friendly)
; Uses COORDINATOR_INTERVAL_MINUTES (integer minutes). Default is 1 minute.

[program:laravel-scheduler-minutes]
process_name=%(program_name)s
command=bash -lc 'cd /home/egfollow/htdocs/egfollow.com && while true; do php artisan schedule:run >> /home/egfollow/htdocs/egfollow.com/storage/logs/laravel-scheduler-minutes.log 2>&1; sleep ${COORDINATOR_INTERVAL_MINUTES:-1}m; done'
directory=/home/egfollow/htdocs/egfollow.com
autostart=true
autorestart=true
startsecs=5
user=egfollow
redirect_stderr=true
stdout_logfile=/home/egfollow/htdocs/egfollow.com/storage/logs/laravel-scheduler-minutes.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=7
stopsignal=QUIT
killasgroup=true
stopwaitsecs=10
environment=APP_ENV="production",APP_DEBUG="false",COORDINATOR_INTERVAL_MINUTES="1"

; Notes:
; - This program runs `schedule:run` every COORDINATOR_INTERVAL_MINUTES minutes (default 1).
; - It writes to an absolute logfile path to avoid relative-path permission surprises.
; - Ensure /home/egfollow/htdocs/egfollow.com/storage/logs is owned by `egfollow` and writable.
