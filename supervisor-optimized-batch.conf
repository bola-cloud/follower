# Laravel Queue Workers - Optimized for Batch Processing and High Load
# This configuration is designed to handle 5000+ concurrent users with minimal database connections

# High Priority Queue - MQTT announcements and real-time operations
[program:laravel-queue-high]
process_name=%(program_name)s_%(process_num)02d
command=php /home/egfollow/htdocs/egfollow.com/artisan queue:work redis --queue=high --tries=2 --timeout=30 --sleep=1 --memory=128 --max-jobs=500 --max-time=1800
directory=/home/egfollow/htdocs/egfollow.com
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/home/egfollow/htdocs/egfollow.com/storage/logs/queue-high.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
numprocs=4
user=egfollow
environment=LARAVEL_ENVIROMENT=production

# Optimized Actions Queue - NEW: Batch processing with connection pooling
[program:laravel-queue-optimized-actions]
process_name=%(program_name)s_%(process_num)02d
command=php /home/egfollow/htdocs/egfollow.com/artisan queue:work redis --queue=optimized-actions --tries=2 --timeout=120 --sleep=1 --memory=256 --max-jobs=100 --max-time=3600
directory=/home/egfollow/htdocs/egfollow.com
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/home/egfollow/htdocs/egfollow.com/storage/logs/queue-optimized-actions.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
numprocs=3
user=egfollow
environment=LARAVEL_ENVIROMENT=production

# Bulk Operations Queue - Large batch processing
[program:laravel-queue-bulk]
process_name=%(program_name)s_%(process_num)02d
command=php /home/egfollow/htdocs/egfollow.com/artisan queue:work redis --queue=bulk --tries=1 --timeout=300 --sleep=2 --memory=512 --max-jobs=50 --max-time=7200
directory=/home/egfollow/htdocs/egfollow.com
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/home/egfollow/htdocs/egfollow.com/storage/logs/queue-bulk.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
numprocs=2
user=egfollow
environment=LARAVEL_ENVIROMENT=production

# Actions Queue - Legacy individual action processing (reduced)
[program:laravel-queue-actions]
process_name=%(program_name)s_%(process_num)02d
command=php /home/egfollow/htdocs/egfollow.com/artisan queue:work redis --queue=actions --tries=2 --timeout=60 --sleep=1 --memory=256 --max-jobs=200 --max-time=1800
directory=/home/egfollow/htdocs/egfollow.com
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/home/egfollow/htdocs/egfollow.com/storage/logs/queue-actions.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
numprocs=2
user=egfollow
environment=LARAVEL_ENVIROMENT=production

# Default Queue - Fallback and general processing
[program:laravel-queue-default]
process_name=%(program_name)s_%(process_num)02d
command=php /home/egfollow/htdocs/egfollow.com/artisan queue:work redis --queue=default --tries=3 --timeout=60 --sleep=1 --memory=256 --max-jobs=200 --max-time=1800
directory=/home/egfollow/htdocs/egfollow.com
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/home/egfollow/htdocs/egfollow.com/storage/logs/queue-default.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
numprocs=1
user=egfollow
environment=LARAVEL_ENVIROMENT=production

# Group configuration for easy management
[group:laravel-queues]
programs=laravel-queue-high,laravel-queue-optimized-actions,laravel-queue-bulk,laravel-queue-actions,laravel-queue-default
priority=999

# Performance Notes:
# Total Workers: 12 (4 high + 3 optimized + 2 bulk + 2 actions + 1 default)
# Expected MySQL Connections: 15-25 (down from 100-200)
# Optimized for: 5000+ concurrent users
# Memory Usage: ~2.5GB total for all workers
# Processing Capacity: 10,000+ jobs per hour
